[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fs-tool"
version = "0.1.0"
description = "Filesystem tool for inventory, comparison, and safe file operations"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Paul Magister", email = "paul@magister.de"}
]
requires-python = ">=3.13"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
]
keywords = ["filesystem", "inventory", "hash", "compare", "backup", "cleanup"]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
]

[project.scripts]
fs-tool = "fs_tool.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fs_tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
