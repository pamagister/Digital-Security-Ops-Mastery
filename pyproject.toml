[project]
name = "Digital-Security-Ops-Mastery"
version = "0.0.0"
description = "A modern hands-on guide for building secure, privacy-first PC and smartphone setups – from Linux automation and child-safe devices to Google-free digital independence."
authors = [
    {name = "pamagister"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.0.10",
    "keyring>=25.7.0",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "urllib3>=2.8.0",
]

# Dev dependencies as optional dependenciesea
[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
]

docs = [
    "mkdocs>=1.6.1",
    "pygments>=2.19.1",
]

test = [
    "pytest>=8.4.0",
    "pyyaml>=6.0",
]

[tool.uv]
# This repository is documentation, not an installable package. Without this,
# `uv run` tries to build the project and setuptools' flat-layout discovery
# fails on top-level directories such as site/ and temp/.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: checks that need internet access (deselect with '-m \"not network\"')",
]
